<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEC Entrance Result – Nova Education Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#ED1C24;--red-d:#C8101A;--blue:#14449A;--bg:#F3F6FB;--card:#fff;--ink:#16203A;--mute:#5B6784;--line:#DDE4F0;--tint:#FDECEC;--plate:#fff;--ok:#14449A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1426;--card:#16203A;--ink:#EEF2FA;--mute:#9FABC6;--line:#2A3556;--tint:#3A1D26;--blue:#8DB2FF}}
:root[data-theme="dark"]{--bg:#0D1426;--card:#16203A;--ink:#EEF2FA;--mute:#9FABC6;--line:#2A3556;--tint:#3A1D26;--blue:#8DB2FF}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.55 Montserrat,"Segoe UI",system-ui,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--plate);border-bottom:4px solid var(--red);padding:20px 16px 18px;text-align:center}
header img{width:min(64vw,230px);height:auto;display:block;margin:0 auto}
header h1{margin:14px auto 0;max-width:30ch;font-size:clamp(1.15rem,4.6vw,1.6rem);line-height:1.25;font-weight:800;color:#14449A}
header p{margin:6px 0 0;color:#5B6784;font-size:.85rem;font-weight:600}
main{flex:1;width:100%;max-width:520px;margin:0 auto;padding:24px 16px 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;box-shadow:0 6px 24px rgba(20,68,154,.08)}
label{display:block;font-weight:700;font-size:1.05rem;text-align:center;margin-bottom:12px}
input{width:100%;font:700 1.5rem Montserrat,system-ui,sans-serif;letter-spacing:.08em;text-align:center;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input::placeholder{color:var(--mute);opacity:.6;letter-spacing:.04em}
input:focus-visible{outline:3px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.err-inline{min-height:1.4em;margin:8px 0 0;text-align:center;color:var(--red-d);font-size:.85rem;font-weight:600}
button{font:800 1.05rem Montserrat,system-ui,sans-serif;cursor:pointer;border:0;border-radius:12px;padding:15px 20px;width:100%}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#go{background:var(--red);color:#fff;margin-top:6px}
#go:hover{background:var(--red-d)}
#again{background:transparent;color:var(--blue);border:2px solid var(--blue);margin-top:18px}
#out{margin-top:20px}
.show{animation:rise .45s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rank{text-align:center;padding:6px 0 16px;border-bottom:1px solid var(--line)}
.rank small{display:block;color:var(--mute);font-weight:600;font-size:.95rem}
.rank b{display:block;font-size:clamp(3.4rem,18vw,5.2rem);line-height:1.05;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.pair div{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.pair span{display:block;color:var(--mute);font-size:.8rem;font-weight:600}
.pair strong{display:block;font-size:1.45rem;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}
.wish{background:var(--tint);border-left:5px solid var(--red);border-radius:10px;padding:14px 16px;font-size:.95rem}
.wish strong{display:block;font-size:1.05rem;margin-bottom:4px}
.msg{text-align:center;font-weight:600}
.msg p{margin:0 0 8px}
.msg .sub{color:var(--mute);font-size:.85rem;font-weight:500}
.msg .big{font-size:1.1rem;font-weight:800;color:var(--red-d)}
footer{text-align:center;color:var(--mute);font-size:.75rem;padding:0 16px 22px}
@media (prefers-reduced-motion:reduce){.show{animation:none}}
</style>
</head>
